<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Troll Modz</title>
  <style>
    :root {
      --bg: #05070a;
      --card-bg: #0b1118;
      --border: #152232;
      --cyan: #00f2fe;
      --cyan-dim: rgba(0, 242, 254, 0.2);
      --cyan-glow: rgba(0, 242, 254, 0.4);
      --text: #f0f6fc;
      --text-muted: #6e7f91;
      --green: #00ff88;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 14px;
    }

    /* Floating Cyber Card */
    .cyber-card {
      width: 100%;
      max-width: 390px;
      background: var(--card-bg);
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 0 35px var(--cyan-dim), inset 0 0 15px rgba(0, 242, 254, 0.05);
      position: relative;
    }

    /* Logo & Title */
    .title-wrap {
      text-align: center;
      margin-bottom: 22px;
    }

    .main-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--cyan);
      text-shadow: 0 0 14px var(--cyan-glow);
      display: inline-block;
      cursor: pointer;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-top: 5px;
      text-transform: uppercase;
    }

    /* Key Input Screen */
    .input-field {
      width: 100%;
      padding: 14px;
      background: #06090d;
      border: 1px solid var(--cyan);
      border-radius: 10px;
      color: var(--cyan);
      font-size: 14px;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 16px;
      outline: none;
      box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.15);
    }

    /* Status Card */
    .status-panel {
      background: #06090e;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-row span:first-child {
      color: var(--text-muted);
      font-weight: 600;
    }

    .status-row span:last-child {
      font-weight: 700;
      color: var(--cyan);
    }

    /* Toggle Items */
    .toggle-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }

    .toggle-item {
      background: #06090e;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }

    .toggle-item:hover {
      border-color: rgba(0, 242, 254, 0.3);
    }

    .toggle-label {
      font-size: 13.5px;
      font-weight: 600;
    }

    /* Sub-options for Hifi */
    .sub-toggle-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 18px;
      border-left: 2px solid var(--cyan);
      margin: 4px 0 6px 10px;
    }

    .sub-toggle-item {
      background: #080d14;
      border: 1px dashed rgba(0, 242, 254, 0.3);
      border-radius: 7px;
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sub-toggle-label {
      font-size: 12px;
      color: #9ab0c5;
    }

    /* Cyber Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 23px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #1a2533;
      border-radius: 24px;
      transition: .3s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 17px;
      width: 17px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      border-radius: 50%;
      transition: .3s;
    }

    input:checked + .slider {
      background-color: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    input:checked + .slider:before {
      transform: translateX(21px);
      background-color: #05070a;
    }

    /* Action Buttons */
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--cyan);
      color: #040608;
      font-weight: 800;
      font-size: 13.5px;
      letter-spacing: 1.5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 18px var(--cyan-glow);
      transition: 0.15s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      box-shadow: none;
      margin-top: 6px;
    }

    .hidden {
      display: none !important;
    }

    /* Admin Modal */
    .admin-overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 16, 0.98);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      z-index: 50;
      overflow-y: auto;
    }

    .admin-overlay h3 {
      color: var(--cyan);
      font-size: 16px;
      margin-bottom: 12px;
      text-align: center;
    }

    .admin-field {
      margin-bottom: 9px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .admin-field label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .admin-field input {
      padding: 9px 12px;
      background: #05070a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .admin-field input:focus {
      border-color: var(--cyan);
    }
  </style>
</head>
<body>

  <div class="cyber-card">
    
    <!-- Title (6-Click trigger for Admin) -->
    <div class="title-wrap">
      <div class="main-title" onclick="handleTitleClick()">TROLL MODZ</div>
      <div class="subtitle" id="topSubtitle">ENTER YOUR ACCESS KEY</div>
    </div>

    <!-- 1. AUTH SCREEN -->
    <div id="authSection">
      <input type="text" id="keyInput" class="input-field" placeholder="XXXX-XXXX-XXXX-XXXX">
      <button class="btn" onclick="validateKey()">UNLOCK ACCESS</button>
      <p id="errorMsg" style="color: #ff4757; font-size: 12px; text-align: center; margin-top: 10px;" class="hidden">Invalid Key. Contact Admin.</p>
    </div>

    <!-- 2. DASHBOARD & TOGGLES SCREEN -->
    <div id="dashSection" class="hidden">
      
      <div class="status-panel">
        <div class="status-row">
          <span>Key:</span>
          <span>TROLL-4E3B-545C-E7AA</span>
        </div>
        <div class="status-row">
          <span>Status:</span>
          <span style="color: var(--green);">CONNECTED</span>
        </div>
        <div class="status-row">
          <span>Expiry:</span>
          <span>LIFETIME</span>
        </div>
      </div>

      <!-- Toggles List -->
      <div class="toggle-list">
        
        <div class="toggle-item">
          <span class="toggle-label" id="lbl1"></span>
          <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <div class="toggle-item">
          <span class="toggle-label" id="lbl2"></span>
          <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <div class="toggle-item">
          <span class="toggle-label" id="lbl3"></span>
          <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <div class="toggle-item">
          <span class="toggle-label" id="lbl4"></span>
          <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <!-- 5. Hifi Toggle with Dropdown Sub-toggles -->
        <div class="toggle-item">
          <span class="toggle-label" id="lbl5"></span>
          <label class="switch">
            <input type="checkbox" id="hifiMaster" onchange="toggleHifiSub(this)">
            <span class="slider"></span>
          </label>
        </div>

        <!-- Hidden Sub-toggles under Hifi -->
        <div id="hifiSubGroup" class="sub-toggle-group hidden">
          <div class="sub-toggle-item">
            <span class="sub-toggle-label" id="lblSub1"></span>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
          </div>
          <div class="sub-toggle-item">
            <span class="sub-toggle-label" id="lblSub2"></span>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
          </div>
        </div>

        <div class="toggle-item">
          <span class="toggle-label" id="lbl6"></span>
          <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

      </div>

      <button class="btn" onclick="openHappApp()">+ ADD SUBSCRIPTION</button>
    </div>

    <!-- 3. HIDDEN ADMIN PANEL -->
    <div id="adminPanel" class="admin-overlay hidden">
      <h3>Admin Panel</h3>
      
      <div class="admin-field"><label>Toggle 1</label><input type="text" id="adm1"></div>
      <div class="admin-field"><label>Toggle 2</label><input type="text" id="adm2"></div>
      <div class="admin-field"><label>Toggle 3</label><input type="text" id="adm3"></div>
      <div class="admin-field"><label>Toggle 4</label><input type="text" id="adm4"></div>
      <div class="admin-field"><label>Toggle 5 (Main)</label><input type="text" id="adm5"></div>
      <div class="admin-field"><label>Hifi Sub-Toggle 1</label><input type="text" id="admSub1"></div>
      <div class="admin-field"><label>Hifi Sub-Toggle 2</label><input type="text" id="admSub2"></div>
      <div class="admin-field"><label>Toggle 6</label><input type="text" id="adm6"></div>

      <button class="btn" style="margin-top: 10px;" onclick="saveAdminData()">SAVE CHANGES</button>
      <button class="btn btn-secondary" onclick="closeAdmin()">CANCEL</button>
    </div>

  </div>

  <script>
    const TARGET_KEY = "TROLL-4E3B-545C-E7AA";
    const ADMIN_PASS = "admin123";

    // Default Configuration
    const defaultConfig = {
      t1: "Prank Sound Trigger",
      t2: "Screen Flicker Mode",
      t3: "Fake Ping Lag",
      t4: "Invert Controls",
      t5: "Hifi",
      sub1: "Ultra Audio Boost",
      sub2: "Surround Echo",
      t6: "Ghost Tap Mode"
    };

    let config = JSON.parse(localStorage.getItem('troll_cfg')) || defaultConfig;

    function applyLabels() {
      document.getElementById('lbl1').innerText = config.t1;
      document.getElementById('lbl2').innerText = config.t2;
      document.getElementById('lbl3').innerText = config.t3;
      document.getElementById('lbl4').innerText = config.t4;
      document.getElementById('lbl5').innerText = config.t5;
      document.getElementById('lblSub1').innerText = config.sub1;
      document.getElementById('lblSub2').innerText = config.sub2;
      document.getElementById('lbl6').innerText = config.t6;
    }

    applyLabels();

    // Key Validation
    function validateKey() {
      const input = document.getElementById('keyInput').value.trim();
      if (input === TARGET_KEY) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('dashSection').classList.remove('hidden');
        document.getElementById('topSubtitle').innerText = "SYSTEM ACTIVE";
        document.getElementById('errorMsg').classList.add('hidden');
      } else {
        document.getElementById('errorMsg').classList.remove('hidden');
      }
    }

    // Expand / Collapse Hifi sub-toggles
    function toggleHifiSub(cb) {
      const sub = document.getElementById('hifiSubGroup');
      if (cb.checked) {
        sub.classList.remove('hidden');
      } else {
        sub.classList.add('hidden');
      }
    }

    // Happ App Deep Link
    function openHappApp() {
      window.location.href = "happ://add/trollmodz-lifetime-config";
    }

    // 6 Consecutive Clicks Detection for Admin
    let clickCount = 0;
    let clickTimer = null;

    function handleTitleClick() {
      clickCount++;
      clearTimeout(clickTimer);

      clickTimer = setTimeout(() => {
        clickCount = 0;
      }, 1500); // 1.5 seconds me 6 clicks hone chahiye

      if (clickCount >= 6) {
        clickCount = 0;
        const entered = prompt("Enter Admin Password:");
        if (entered === ADMIN_PASS) {
          openAdminModal();
        } else if (entered !== null) {
          alert("Incorrect Password!");
        }
      }
    }

    function openAdminModal() {
      document.getElementById('adm1').value = config.t1;
      document.getElementById('adm2').value = config.t2;
      document.getElementById('adm3').value = config.t3;
      document.getElementById('adm4').value = config.t4;
      document.getElementById('adm5').value = config.t5;
      document.getElementById('admSub1').value = config.sub1;
      document.getElementById('admSub2').value = config.sub2;
      document.getElementById('adm6').value = config.t6;

      document.getElementById('adminPanel').classList.remove('hidden');
    }

    function saveAdminData() {
      config.t1 = document.getElementById('adm1').value;
      config.t2 = document.getElementById('adm2').value;
      config.t3 = document.getElementById('adm3').value;
      config.t4 = document.getElementById('adm4').value;
      config.t5 = document.getElementById('adm5').value;
      config.sub1 = document.getElementById('admSub1').value;
      config.sub2 = document.getElementById('admSub2').value;
      config.t6 = document.getElementById('adm6').value;

      localStorage.setItem('troll_cfg', JSON.stringify(config));
      applyLabels();
      closeAdmin();
    }

    function closeAdmin() {
      document.getElementById('adminPanel').classList.add('hidden');
    }
  </script>
</body>
</html>
